name: Release

# Builds one .vsix per platform and attaches them to a GitHub Release.
# duckdb and better-sqlite3 are native addons, so each target is built on a
# runner matching that platform/arch rather than cross-compiled.
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win32-x64
          - os: macos-13
            target: darwin-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build

      - run: npx vsce package --target ${{ matrix.target }} --out eyeball-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: eyeball-${{ matrix.target }}
          path: eyeball-${{ matrix.target }}.vsix

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: find artifacts -name '*.vsix' -exec mv {} . \;

      - uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
