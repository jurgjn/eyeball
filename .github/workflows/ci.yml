# Tests and packages the extension on every push and pull request (the VSIX is kept as a
# workflow artifact), and releases it when a version tag (vX.Y.Z) is pushed: a GitHub release
# is made with the version's section of CHANGELOG.md as its notes and the VSIX attached, and
# the VSIX is also published to the VS Code Marketplace and Open VSX once the VSCE_PAT and
# OVSX_PAT secrets are set.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # a dependency of molstar's dependencies reports installs unless told not to
  SCARF_ANALYTICS: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: test/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: pip install -r test/requirements.txt
      - run: sudo apt-get install -y squashfs-tools
      - name: Generate test files
        run: |
          python test/fixtures/make_fixtures.py "$RUNNER_TEMP/data"
          python test/fixtures/make_sqlite_fixtures.py "$RUNNER_TEMP/data"
          python test/fixtures/make_archive_fixtures.py "$RUNNER_TEMP/data"
      - name: Compare values with pyarrow and sqlite3, and archives with the files they were made from
        run: node test/check.mjs "$RUNNER_TEMP/data"
      - name: Compare values, reading without the helper process
        run: node test/check.mjs "$RUNNER_TEMP/data" --parallel=4

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # releases take their version from the tag: v1.2.3 -> 1.2.3
            version="${GITHUB_REF_NAME#v}"
          else
            # other builds get the run number, so that each build is an update: X.Y.Z-dev.42
            version="$(node -p "require('./package.json').version").$GITHUB_RUN_NUMBER"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
      - name: Package
        run: npx vsce package --no-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: eyeball-vsix
          path: '*.vsix'
          if-no-files-found: error

  publish:
    name: Release
    needs: [test, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # registry tokens are optional: publishing to a registry is skipped while its secret is unset
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      # registries only accept plain major.minor.patch versions; other tags (v1.2.3-beta.1) are pre-releases
      REGISTRY_RELEASE: ${{ !contains(github.ref_name, '-') }}
    steps:
      # the changelog, for the notes of the release (checkout comes first, as it empties the folder)
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eyeball-vsix
      - name: Make the GitHub release, with the VSIX attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # the notes: the version's section of CHANGELOG.md, from its heading to the next one
          awk -v heading="## [$version]" 'index($0, "## [") == 1 { if (found) exit; found = index($0, heading) == 1; next } found' CHANGELOG.md > notes.md
          if grep -q '[^[:space:]]' notes.md; then
            notes=(--notes-file notes.md)
          elif [ "$REGISTRY_RELEASE" != true ]; then
            # pre-releases may have no section of their own
            notes=(--generate-notes)
          else
            echo "::error::CHANGELOG.md has no section for $version (## [$version] - YYYY-MM-DD)"
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # made by hand, or by an earlier run of this job
            gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber --repo "$GITHUB_REPOSITORY"
          else
            prerelease=()
            [ "$REGISTRY_RELEASE" = true ] || prerelease=(--prerelease)
            gh release create "$GITHUB_REF_NAME" ./*.vsix --verify-tag --title "$GITHUB_REF_NAME" "${notes[@]}" "${prerelease[@]}" --repo "$GITHUB_REPOSITORY"
          fi
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != '' && env.REGISTRY_RELEASE == 'true'
        run: npx --yes @vscode/vsce@3 publish --packagePath ./*.vsix
      - name: Publish to Open VSX
        if: env.OVSX_PAT != '' && env.REGISTRY_RELEASE == 'true'
        run: npx --yes ovsx publish ./*.vsix
